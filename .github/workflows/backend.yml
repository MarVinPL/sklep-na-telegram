name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: pip install ".[dev]"
      - name: Run tests
        run: pytest
      - name: Check formatting and lint
        run: ruff check .
