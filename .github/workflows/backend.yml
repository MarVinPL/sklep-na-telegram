name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: shop_test
          POSTGRES_PASSWORD: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_test -d shop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: pip install ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app tests alembic
      - name: Validate database migration
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head
      - name: Run tests (SQLite and PostgreSQL concurrency)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://shop_test:shop_test@localhost:5432/shop_test
        run: pytest
      - name: Check lint
        run: ruff check .
