name: Mini App build

on:
  pull_request:
    paths:
      - "miniapp/**"
      - ".github/workflows/miniapp.yml"
  push:
    branches: [main]
    paths:
      - "miniapp/**"
      - ".github/workflows/miniapp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: test -f dist/handoff.html
